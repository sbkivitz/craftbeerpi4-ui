<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Telling the sections apart at a glance · CraftBeerPi brew-day screen (proposal)</title>
<!--
One page for the brewer to choose subtle cues that set Brew Day's sections apart (22 Nov 2026). Live copies of the
mockup side by side: today; A, each kind of section on a ground of its own; B, the same with a muted colour for each
vessel. The cues are in cues.css, which this page adds to each copy and switches on with data-cues on the copy's root,
so the mockup's own files are unchanged until he chooses. Moments, window sizes, and the timers as today or beside the
drawing (D, ?col=new&tplace=side), the place he is choosing on timers-side.html. "Open the whole screen" opens this page
with ?full=, which shows one copy at the window's size with its cue. One question; the answer is kept in this browser,
to send to Brett.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;display:grid;grid-template-rows:auto minmax(0,1fr);background:#080c10;color:#e8eef3;font:500 16px/1.4 "Barlow","Segoe UI",system-ui,sans-serif}
body.full{display:block}
:focus-visible{outline:3px solid #2a6fc0;outline-offset:2px}
.bar{display:grid;gap:8px;padding:12px 16px;background:#f2efe6;color:#1d232a;border-bottom:2px dashed #1d232a}
.bar h1{margin:0;font:700 20px/1.15 "Barlow",sans-serif}
.bar p{margin:0;font-size:15px;max-width:980px}
main{min-height:0;overflow:auto;padding:16px 18px 40px}
.ctl{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;margin:0 0 10px}
.grp{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.grp>span{font-weight:600;color:#c9d6e2;margin-right:2px}
.grp button{min-height:40px;padding:0 12px;border:1px solid #3b4d5e;border-radius:6px;background:#162029;color:#e8eef3;font:600 15px/1 "Barlow",sans-serif;cursor:pointer}
.grp button:hover{background:#203040}
.grp button[aria-pressed=true]{background:#e8eef3;color:#10161c;border-color:#e8eef3}
.hint{max-width:980px;margin:0 0 16px;color:#c9d6e2}
.hint b{color:#fff}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,520px),1fr));gap:26px 22px;align-items:start;margin:0 0 22px}
.opt{margin:0;display:grid;gap:8px;align-content:start;min-width:0}
.opt h2{margin:0;font:700 21px/1.1 "Barlow Condensed",sans-serif;letter-spacing:.06em;text-transform:uppercase;color:#fff}
.opt h2 .rec{vertical-align:3px}
.opt p{margin:0;color:#c9d6e2;font-size:15px;line-height:1.4}
.opt p b{color:#fff}
.opt a{color:#9fd0ff;font-size:15px}
.opt[data-pick] .cut{box-shadow:0 0 0 2px #2b6a42,0 18px 44px rgb(0 0 0/.5)}
.cut{position:relative;overflow:hidden;border-radius:8px;background:#0f161d;box-shadow:0 0 0 1px #2a3b4b,0 18px 44px rgb(0 0 0/.5)}
.cut iframe{position:absolute;left:0;top:0;border:0;transform-origin:0 0;background:#0f161d}
.qs{display:grid;gap:14px;max-width:980px;margin:0 0 8px;padding:16px;border:1px solid #2a3b4b;border-radius:8px;background:#0f161d}
.qs h3{margin:0 0 4px;font:700 19px/1.3 "Barlow",sans-serif;color:#fff}
.qs p{margin:0;color:#c9d6e2}
.qs p b{color:#fff}
.choices{display:grid;gap:8px}
.choices button{display:grid;gap:3px;justify-items:start;min-height:52px;padding:10px 14px;border:1px solid #3b4d5e;border-radius:6px;background:#162029;color:#e8eef3;text-align:left;font:600 17px/1.3 "Barlow",sans-serif;cursor:pointer}
.choices button:hover{background:#203040}
.choices button small{font:500 15px/1.35 "Barlow",sans-serif;color:#a9b8c6}
.choices button[aria-pressed=true]{background:#e8eef3;color:#10161c;border-color:#e8eef3}
.choices button[aria-pressed=true] small{color:#33404d}
.rec{display:inline-block;margin-left:8px;padding:2px 7px;border-radius:4px;background:#12301f;border:1px solid #2b6a42;color:#bff0cf;font:700 12px/1.2 "Barlow",sans-serif;letter-spacing:.06em;text-transform:uppercase;vertical-align:2px}
.choices button[aria-pressed=true] .rec{background:#1f7a3f;border-color:#1f7a3f;color:#fff}
.acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.acts button{min-height:44px;padding:0 16px;border:1px solid #e8eef3;border-radius:6px;background:#e8eef3;color:#10161c;font:700 16px/1 "Barlow",sans-serif;cursor:pointer}
.said{color:#7ee2a0}
.whole{position:fixed;inset:0;width:100%;height:100%;border:0}
</style>
</head>
<body>
<header class="bar" id="top">
  <h1>Telling the sections apart at a glance</h1>
  <p>You asked for a subtle shift, so that each part of Brew Day reads as describing something different. Below, today's screen and two ways of doing it, all live: tap them to try. My pick is marked. Then answer the one question at the bottom.</p>
</header>
<main id="main"></main>
<script>
"use strict";
const SIZES = {w950: ["Your monitor · 1920 × 950", 1920, 950], w1440: ["1440 × 900", 1440, 900], w1180: ["1180 × 860", 1180, 860], phone: ["Phone", 390, 844]};
const OPTS = [
  {id: "today", cue: "", h: "Today",
    p: "<b>As built now:</b> every section on the same panel, with the same edge."},
  {id: "a", cue: "a", h: "A · Each kind of section on its own ground", pick: true,
    p: "<b>The things that call for you share the title bar's dark band:</b> the alarms and the last event along the top, the timers along the bottom or beside the drawing. <b>The recipe</b>, the plan, has a faintly cool ground with a blue edge, the colour of the current step. <b>The faceplates</b> stay as they are. <b>The drawing</b> is set back, behind them. No new colours."},
  {id: "b", cue: "b", h: "B · The same, plus a colour for each vessel",
    p: "<b>A as well, and a muted colour for each vessel</b> on its faceplate's top edge and name, and on its outline in the drawing: the hot liquor tank blue, the mash tun grain, the boil kettle copper."}
];
const SCENES = [
  ["mash", "The mash", "<b>The mash, mid-rest.</b> Look at where your eye goes first, and whether the recipe, the faceplates, the drawing and the top band each read as their own thing."],
  ["hop", "The boil", "<b>The boil, with a hop addition due.</b> The amber question in the title bar should still be the first thing you see."],
  ["sw-plan", "The night before", "<b>The night before, with the strike water box up</b> in the recipe column."]
];
const LAYS = {today: ["As today", ""], side: ["Beside the drawing (D)", "col=new&tplace=side"]};
const KEY = "bd-cues-22nov";
let A = "";
try { A = localStorage.getItem(KEY) || ""; } catch (_) { A = ""; }
const S = {scene: SCENES[0][0], size: "w950", lay: "today"};
function readHash() {
  const q = new URLSearchParams(location.hash.slice(1));
  if (SCENES.some(s => s[0] === q.get("scene"))) S.scene = q.get("scene");
  if (SIZES[q.get("size")]) S.size = q.get("size");
  if (LAYS[q.get("lay")]) S.lay = q.get("lay");
}
readHash();
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"})[c]);
const flags = () => ["bare", LAYS[S.lay][1]].filter(Boolean).join("&");
const src = () => `review/brew-day.html?${flags()}#${S.scene}`;
const hashOf = () => `#scene=${S.scene}&size=${S.size}&lay=${S.lay}`;
/* the cue for a copy: this page's stylesheet added to it, then switched on on its root; again each time it loads */
function cue(fr, c) {
  fr.addEventListener("load", () => {
    if (!c) return;
    let d;
    try { d = fr.contentDocument; } catch (_) { return; }
    if (!d || d.getElementById("cues-css")) return;
    const l = d.createElement("link");
    l.id = "cues-css"; l.rel = "stylesheet"; l.href = "cues.css";
    l.onload = () => { d.documentElement.dataset.cues = c; fr.contentWindow.dispatchEvent(new Event("resize")); };
    d.head.appendChild(l);
  });
}
const QS = [
  {id: "a", h: "A · Each kind of section on its own ground", pick: true, s: "The sections set apart by their grounds, with no new colours."},
  {id: "b", h: "B · The same, plus a colour for each vessel", s: "Each faceplate linked to its vessel in the drawing by a colour."},
  {id: "none", h: "Neither", s: "Keep the screen as it is."}
];
function render() {
  const m = document.getElementById("main"), sc = SCENES.find(s => s[0] === S.scene);
  m.innerHTML = `<div class="ctl"><div class="grp" role="group" aria-label="Moment"><span>Moment:</span>${SCENES.map(s => `<button type="button" data-scene="${s[0]}" aria-pressed="${s[0] === S.scene}">${s[1]}</button>`).join("")}</div>
    <div class="grp" role="group" aria-label="Screen"><span>Screen:</span>${Object.keys(SIZES).map(z => `<button type="button" data-size="${z}" aria-pressed="${z === S.size}">${esc(SIZES[z][0])}</button>`).join("")}</div>
    <div class="grp" role="group" aria-label="Timers"><span>Timers:</span>${Object.keys(LAYS).map(k => `<button type="button" data-lay="${k}" aria-pressed="${k === S.lay}">${esc(LAYS[k][0])}</button>`).join("")}</div></div>
    <p class="hint">${sc[2]}${S.size === "phone" ? " <b>On a phone the change is smaller:</b> the top band and the recipe's edge." : ""}</p>
    <div class="opts">${OPTS.map(o => `<figure class="opt" data-o="${o.id}"${o.pick ? " data-pick" : ""}><h2>${esc(o.h)}${o.pick ? '<span class="rec">My pick</span>' : ""}</h2><p>${o.p}</p>
      <div class="cut"><iframe title="${esc(o.h)}" src="${src()}" tabindex="-1"></iframe></div>
      <a target="_blank" rel="noopener" href="cues.html?full=${o.id}${hashOf()}">Open the whole screen</a></figure>`).join("")}</div>
    <section class="qs" aria-label="The question"><h3 id="q-h">Which would you like?</h3>
      <p><b>Why A:</b> it sets the sections apart without adding colours, so red, green and amber still stand out for what they mean. B's three colours link each faceplate to its vessel, but sit close to the screen's own: the copper near the heating orange, the grain near the amber that waits for you.</p>
      <div class="choices" role="group" aria-labelledby="q-h">${QS.map(q => `<button type="button" data-a="${q.id}" aria-pressed="${A === q.id}"><span>${esc(q.h)}${q.pick ? '<span class="rec">My pick</span>' : ""}</span><small>${esc(q.s)}</small></button>`).join("")}</div>
      <div class="acts"><button type="button" id="copy">Copy my answer</button><span class="said" id="said" aria-live="polite"></span></div></section>`;
  history.replaceState(null, "", hashOf());
  m.querySelectorAll(".opt").forEach(f => cue(f.querySelector("iframe"), OPTS.find(o => o.id === f.dataset.o).cue));
  fit();
}
/* each copy is a whole screen at the chosen size, scaled down to its card's width */
function fit() {
  const [, w, h] = SIZES[S.size];
  document.querySelectorAll(".opt").forEach(f => {
    const cut = f.querySelector(".cut"), fr = cut.querySelector("iframe"), s = Math.min(1, cut.clientWidth / w);
    fr.style.width = w + "px"; fr.style.height = h + "px"; fr.style.transform = `scale(${s})`;
    cut.style.height = (h * s) + "px";
  });
}
/* ?full=: one copy with its cue at the window's own size */
const FULL = new URLSearchParams(location.search).get("full");
const answer = () => { const q = QS.find(x => x.id === A); return q ? `Section cues: ${q.h}${q.pick ? " (Amber's pick)" : ""}` : "Section cues: not answered yet"; };
if (FULL && OPTS.some(o => o.id === FULL)) {
  document.body.className = "full";
  document.getElementById("top").remove();
  const o = OPTS.find(x => x.id === FULL), m = document.getElementById("main");
  m.style.padding = "0";
  m.innerHTML = `<iframe class="whole" title="${esc(o.h)}" src="${src()}"></iframe>`;
  cue(m.querySelector("iframe"), o.cue);
} else {
  document.addEventListener("click", e => {
    const b = e.target.closest("button");
    if (!b) return;
    if (b.dataset.scene) { S.scene = b.dataset.scene; render(); return; }
    if (b.dataset.size) { S.size = b.dataset.size; render(); return; }
    if (b.dataset.lay) { S.lay = b.dataset.lay; render(); return; }
    if (b.dataset.a) {
      A = b.dataset.a; try { localStorage.setItem(KEY, A); } catch (_) {}
      document.querySelectorAll("[data-a]").forEach(x => x.setAttribute("aria-pressed", x === b));
      return;
    }
    if (b.id === "copy") {
      const t = answer(), said = document.getElementById("said");
      const ok = () => { said.textContent = "Copied. Paste it in your chat with Brett."; };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(ok, () => { said.textContent = t; });
      else said.textContent = t;
    }
  });
  addEventListener("resize", fit);
  addEventListener("hashchange", () => { readHash(); render(); });
  render();
}
</script>
</body>
</html>
