<title>Recipe book · the other two layouts (mockup)</title>
<!--
The two other layouts the design tool dealt for the Recipe book, drawn for comparison with recipes.html: one moment
each, a recipe open, the same recipe and state as recipes.html#book (Craftbeerpi Test Recipe v5, on Brew day, ready to
start). ?layout=vessel draws the steps by vessel under the brewhouse drawing; ?layout=sheet draws the recipe as a brew
sheet, one ruled table of steps. The book is the list down the left in both, as Settings' and Hardware's lists are.
Static pictures only: the buttons do nothing. recipes.html stays the clickable mockup.
-->
