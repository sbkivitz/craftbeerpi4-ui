<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The boil kettle's MANUAL: today and proposed · CraftBeerPi brew-day screen (proposal)</title>
<!--
This page shows the boil kettle's faceplate two ways, cut out of the live mockup (&focus=bk): as built (brew-day.html)
and the proposal of 22 Nov (?bkman=new, BOIL-MANUAL.md), in which MANUAL heats at the boil power, at four moments.
"Whole screen" shows the pages uncut.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;display:grid;grid-template-rows:auto auto minmax(0,1fr);background:#080c10;color:#e8eef3;font:500 15px/1.35 "Barlow","Segoe UI",system-ui,sans-serif}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 22px;padding:10px 16px;background:#f2efe6;color:#1d232a;border-bottom:2px dashed #1d232a}
.bar h1{margin:0 6px 0 0;font:700 19px/1 "Barlow",sans-serif}
.grp{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.grp>span{font-weight:600;margin-right:2px}
.grp button{min-height:36px;padding:0 12px;border:1px solid #1d232a;border-radius:6px;background:#fff;color:#1d232a;font:600 14px/1 "Barlow",sans-serif;cursor:pointer}
.grp button:hover{background:#e6e1d4}
.grp button[aria-pressed=true]{background:#1d232a;color:#f2efe6}
:focus-visible{outline:3px solid #2a6fc0;outline-offset:2px}
.hint{margin:0;padding:10px 16px;background:#11181f;color:#c9d6e2;border-bottom:1px solid #2a3b4b;font-size:16px}
.hint b{color:#fff}
.stage{display:flex;flex-wrap:wrap;align-items:flex-start;gap:26px 34px;padding:18px 22px;min-height:0;overflow:auto}
.frame{margin:0;display:grid;gap:12px;align-content:start}
.frame h2{margin:0 0 6px;font:700 22px/1.1 "Barlow Condensed",sans-serif;letter-spacing:.06em;text-transform:uppercase;color:#fff}
.frame h2 small{display:block;margin-top:4px;font:600 15px/1.2 "Barlow",sans-serif;letter-spacing:0;text-transform:none;color:#8b9cad}
figcaption{max-width:460px;font:500 15px/1.4 "Barlow",sans-serif;color:#c9d6e2}
figcaption p{margin:0 0 6px}
figcaption a{color:#9fd0ff}
.cut{position:relative;overflow:hidden;border-radius:8px;background:#0f161d;box-shadow:0 0 0 1px #2a3b4b,0 24px 60px rgb(0 0 0/.55)}
.cut iframe{position:absolute;left:0;top:0;border:0;transform-origin:0 0;background:#0f161d}
</style>
</head>
<body>
<header class="bar">
  <h1>The boil kettle's MANUAL</h1>
  <div class="grp" role="group" aria-label="Moment in the brew day">
    <span>Moment:</span>
    <button type="button" data-scene="bk-hand">Heating by hand</button><button type="button" data-scene="bk-hand-off">By hand, element off</button><button type="button" data-scene="sparge">The sparge, in MANUAL</button><button type="button" data-scene="boiling">Boiling in AUTO</button>
  </div>
  <div class="grp" role="group" aria-label="Screen">
    <span>Screen:</span>
    <button type="button" data-size="small">Small window, 1180×860</button><button type="button" data-size="laptop">1440×900</button><button type="button" data-size="window">Monitor, 1920×950</button><button type="button" data-size="phone">Phone, 390×844</button>
  </div>
  <div class="grp" role="group" aria-label="How much to show">
    <span>Show:</span>
    <button type="button" data-cut="part">Boil kettle only</button><button type="button" data-cut="whole">Whole screen</button>
  </div>
</header>
<p class="hint" id="hint"></p>
<main class="stage" id="stage">
  <figure class="frame" data-k="today"><figcaption><h2>Today<small>as built</small></h2>
    <p>In MANUAL the framed number still sets the boil power, which only AUTO uses. By hand the element heats at a level of its own: 70 % on the simulator. Nothing on this screen shows that level before it heats, or changes it.</p><a target="_blank" rel="noopener">Open full size</a></figcaption>
    <div class="cut"><iframe title="The boil kettle as built"></iframe></div></figure>
  <figure class="frame" data-k="new"><figcaption><h2>Proposal<small>one number, in AUTO and by hand</small></h2>
    <p>By hand the element heats at the framed number, which reads HAND in MANUAL and BOIL in AUTO. OUT matches it while the element heats, and −5 %, −1 %, +1 % and +5 % stay in MANUAL.</p><a target="_blank" rel="noopener">Open full size</a></figcaption>
    <div class="cut"><iframe title="The boil kettle as proposed"></iframe></div></figure>
</main>
<script>
"use strict";
const SIZES = {small: [1180, 860], laptop: [1440, 900], window: [1920, 950], phone: [390, 844]};
const HINT = {
  "bk-hand": "<b>10:04, brewing by hand: the wort is just under a boil, and the boil kettle's element is on in MANUAL.</b> Today the window says BOIL 45 % while OUT says the element runs at 70 %, its own level, which no button on this screen changes. That is what the simulator on port 8012 showed. In the proposal the element runs at the framed number, so the window and OUT both say 45 %, and a tap on −5 %, −1 %, +1 % or +5 % changes the element at once.",
  "bk-hand-off": "<b>The same, with the element off.</b> Today nothing says what the element will heat at once it's on. In the proposal the line under the window says it, \"MANUAL · heats at 45 % by hand\", and the steps change it before the element goes on. Turning it on is still a held press.",
  sparge: "<b>15:12, the sparge.</b> The boil kettle is filling, in MANUAL, with its element off. Today the framed 45 % sets the boil power for later, and the element would heat at its own 100 % if turned on by hand. In the proposal it would heat at 45 %, as the window says. AUTO uses the same number once the wort boils.",
  boiling: "<b>15:52, a full boil at 212 °F, in AUTO.</b> Nothing changes in AUTO. The element runs at the boil power, 45 %, and −5 %, −1 %, +1 % or +5 % change it. In the proposal the number is the same one MANUAL heats at."
};
const S = {};
function readHash() {
  const q = new URLSearchParams(location.hash.slice(1));
  S.scene = HINT[q.get("scene")] ? q.get("scene") : "bk-hand";
  S.size = SIZES[q.get("size")] ? q.get("size") : "laptop";
  S.cut = q.get("cut") === "whole" ? "whole" : "part";
}
readHash();
const stage = document.getElementById("stage"), frames = [...document.querySelectorAll(".frame")];
const rect = new Map();
const src = (k, full) => `brew-day.html?${full ? "" : "bare&focus=bk&"}${k === "new" ? "bkman=new" : "bkman=today"}#${S.scene}`;
/* each page tells this one where its boil kettle is: brew-day.js reportFocus */
addEventListener("message", e => {
  const f = frames.find(f => f.querySelector("iframe").contentWindow === e.source);
  if (!f || !e.data || e.data.type !== "plate") return;
  rect.set(f.dataset.k, e.data);
  fit();
});
function fit() {
  const [w, h] = SIZES[S.size], whole = S.cut === "whole", m = 6;
  const aw = (stage.clientWidth - 44 - 34) / 2;
  const any = [...rect.values()][0];
  const rs = frames.map(f => rect.get(f.dataset.k) || any || {x: 0, y: 0, w, h});
  const s = whole ? Math.min(1, aw / w) : Math.min(1, ...rs.map(x => aw / (x.w + 2 * m)));
  frames.forEach((f, i) => {
    const cut = f.querySelector(".cut"), fr = f.querySelector("iframe"), x = rs[i];
    fr.style.width = w + "px"; fr.style.height = h + "px";
    if (whole) {
      cut.style.width = (w * s) + "px"; cut.style.height = (h * s) + "px";
      fr.style.transform = `scale(${s})`;
    } else {
      cut.style.width = ((x.w + 2 * m) * s) + "px"; cut.style.height = ((x.h + 2 * m) * s) + "px";
      fr.style.transform = `translate(${(-x.x + m) * s}px, ${(-x.y + m) * s}px) scale(${s})`;
    }
  });
}
function apply() {
  document.querySelectorAll("[data-scene]").forEach(b => b.setAttribute("aria-pressed", b.dataset.scene === S.scene));
  document.querySelectorAll("[data-size]").forEach(b => b.setAttribute("aria-pressed", b.dataset.size === S.size));
  document.querySelectorAll("[data-cut]").forEach(b => b.setAttribute("aria-pressed", b.dataset.cut === S.cut));
  document.getElementById("hint").innerHTML = HINT[S.scene];
  frames.forEach(f => {
    const fr = f.querySelector("iframe"), want = src(f.dataset.k);
    if (fr.getAttribute("src") !== want) { rect.delete(f.dataset.k); fr.setAttribute("src", want); }
    f.querySelector("figcaption a").href = src(f.dataset.k, true);
  });
  history.replaceState(null, "", `#scene=${S.scene}&size=${S.size}&cut=${S.cut}`);
  fit();
}
document.addEventListener("click", e => {
  const b = e.target.closest("button");
  if (!b) return;
  if (b.dataset.scene) S.scene = b.dataset.scene;
  if (b.dataset.size) { S.size = b.dataset.size; rect.clear(); frames.forEach(f => f.querySelector("iframe").removeAttribute("src")); }
  if (b.dataset.cut) S.cut = b.dataset.cut;
  apply();
});
addEventListener("resize", fit);
apply();
</script>
</body>
</html>
