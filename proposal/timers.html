<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stopping and removing a timer: today and the proposal · CraftBeerPi brew-day screen (proposal)</title>
<!--
This page shows the brew-day screen's timers two ways, cut out of the live mockup (&focus=recipe on a monitor,
&focus=tmrs on a phone): as built (brew-day.html) and the proposal of 22 Nov (?trow=new, TIMER-REMOVE.md), at five
moments. "Whole screen" shows the pages uncut.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;display:grid;grid-template-rows:auto auto minmax(0,1fr);background:#080c10;color:#e8eef3;font:500 15px/1.35 "Barlow","Segoe UI",system-ui,sans-serif}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 22px;padding:10px 16px;background:#f2efe6;color:#1d232a;border-bottom:2px dashed #1d232a}
.bar h1{margin:0 6px 0 0;font:700 19px/1 "Barlow",sans-serif}
.grp{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.grp>span{font-weight:600;margin-right:2px}
.grp button{min-height:36px;padding:0 12px;border:1px solid #1d232a;border-radius:6px;background:#fff;color:#1d232a;font:600 14px/1 "Barlow",sans-serif;cursor:pointer}
.grp button:hover{background:#e6e1d4}
.grp button[aria-pressed=true]{background:#1d232a;color:#f2efe6}
:focus-visible{outline:3px solid #2a6fc0;outline-offset:2px}
.hint{margin:0;padding:10px 16px;background:#11181f;color:#c9d6e2;border-bottom:1px solid #2a3b4b;font-size:16px;max-width:none}
.hint b{color:#fff}
.stage{display:flex;flex-wrap:wrap;align-items:flex-start;gap:26px 34px;padding:18px 22px;min-height:0;overflow:auto}
.frame{margin:0;display:grid;gap:12px;align-content:start}
.frame h2{margin:0 0 6px;font:700 22px/1.1 "Barlow Condensed",sans-serif;letter-spacing:.06em;text-transform:uppercase;color:#fff}
.frame h2 small{display:block;margin-top:4px;font:600 15px/1.2 "Barlow",sans-serif;letter-spacing:0;text-transform:none;color:#8b9cad}
figcaption{max-width:460px;font:500 15px/1.4 "Barlow",sans-serif;color:#c9d6e2}
figcaption p{margin:0 0 6px}
figcaption a{color:#9fd0ff}
.cut{position:relative;overflow:hidden;border-radius:8px;background:#0f161d;box-shadow:0 0 0 1px #2a3b4b,0 24px 60px rgb(0 0 0/.55)}
.cut iframe{position:absolute;left:0;top:0;border:0;transform-origin:0 0;background:#0f161d}
</style>
</head>
<body>
<header class="bar">
  <h1>Stopping and removing a timer</h1>
  <div class="grp" role="group" aria-label="Moment in the brew day">
    <span>Moment:</span>
    <button type="button" data-scene="timers">Two timers in a recipe</button><button type="button" data-scene="timers-hand">Three, brewing by hand</button><button type="button" data-scene="timer-removed">Just removed</button><button type="button" data-scene="timer-change">A timer's box open</button><button type="button" data-scene="timer-done">A timer runs out</button>
  </div>
  <div class="grp" role="group" aria-label="Screen">
    <span>Screen:</span>
    <button type="button" data-size="window">Monitor, 1920×950</button><button type="button" data-size="small">Small window, 1180×860</button><button type="button" data-size="phone">Phone, 390×844</button>
  </div>
  <div class="grp" role="group" aria-label="How much to show">
    <span>Show:</span>
    <button type="button" data-cut="part">Recipe column only</button><button type="button" data-cut="whole">Whole screen</button>
  </div>
</header>
<p class="hint" id="hint"></p>
<main class="stage" id="stage">
  <figure class="frame" data-k="today"><figcaption><h2>Today<small>as on the rig, post25</small></h2>
    <p>One button on each timer: START, or PAUSE while it counts. To stop or remove one you tap its name, then REMOVE in the box that opens, then REMOVE IT if it still has time left. Nothing on the row says so.</p><a target="_blank" rel="noopener">Open full size</a></figcaption>
    <div class="cut"><iframe title="The timers as built"></iframe></div></figure>
  <figure class="frame" data-k="new"><figcaption><h2>Proposal<small>REMOVE on the row</small></h2>
    <p>REMOVE beside START or PAUSE on every timer, always in the same place, one tap, with UNDO in its place for 10 seconds. Back to its full time is in its box (BACK TO 15:00). + TIMER moves up beside SOUND, so two timers take a little less room than today.</p><a target="_blank" rel="noopener">Open full size</a></figcaption>
    <div class="cut"><iframe title="The proposal: REMOVE on the row"></iframe></div></figure>
</main>
<script>
"use strict";
const SIZES = {window: [1920, 950], small: [1180, 860], phone: [390, 844]};
const HINT = {
  timers: "<b>14:32, the mash: Stir counting down, Yeast set up for later.</b> Today each timer has one button, START or PAUSE, which is all you saw on the rig. In the proposal every timer has REMOVE beside it, and + TIMER sits beside SOUND, so nothing under the timers takes the step list's room.",
  "timers-hand": "<b>Brewing by hand, with one timer counting down, one paused and one ready.</b> REMOVE is in the same place on all three, so you never hunt for it. START or PAUSE stays at the far right, where your hand already goes, and REMOVE is drawn quieter than it, so the two don't read as equals.",
  "timer-removed": "<b>Just after REMOVE on Stir, which had 7:15 to go.</b> Today a timer with time left asks first, in its box (REMOVE IT or KEEP IT). The proposal removes it at once and keeps its row in place for 10 seconds, saying \"removed\", with UNDO where its buttons were. UNDO puts it back as it was, still counting. A second tap on REMOVE lands on UNDO, and the timer below doesn't jump up under your finger.",
  "timer-change": "<b>Stir's box, opened by tapping its name.</b> Today REMOVE is in here. In the proposal it's on the row, so the box has BACK TO 15:00 instead: Stir goes back to its full time, stopped, ready to START again, like a kitchen timer's clear. While the box is open, Stir's row is the one-line row of today, so the box still fits a small window.",
  "timer-done": "<b>Stir has run out.</b> Nothing changes here: +5 MIN and OK, as today. After OK, Stir is back at 15:00, with REMOVE and START."
};
const S = {};
function readHash() {
  const q = new URLSearchParams(location.hash.slice(1));
  S.scene = HINT[q.get("scene")] ? q.get("scene") : "timers";
  S.size = SIZES[q.get("size")] ? q.get("size") : "window";
  S.cut = q.get("cut") === "whole" ? "whole" : "part";
}
readHash();
const stage = document.getElementById("stage"), frames = [...document.querySelectorAll(".frame")];
const rect = new Map();
const focus = () => S.size === "phone" ? "tmrs" : "recipe";
const src = (k, full) => `brew-day.html?${full ? "" : `bare&focus=${focus()}&`}${k === "new" ? "trow=new" : "trow=today"}#${S.scene}`;
/* each page tells this one where its recipe column (or, on a phone, its timers) is: brew-day.js reportFocus */
addEventListener("message", e => {
  const f = frames.find(f => f.querySelector("iframe").contentWindow === e.source);
  if (!f || !e.data || e.data.type !== "plate") return;
  rect.set(f.dataset.k, e.data);
  fit();
});
function fit() {
  const [w, h] = SIZES[S.size], whole = S.cut === "whole", m = 6;
  const aw = (stage.clientWidth - 44 - 34) / 2;
  const any = [...rect.values()][0];
  const rs = frames.map(f => rect.get(f.dataset.k) || any || {x: 0, y: 0, w, h});
  const s = whole ? Math.min(1, aw / w) : Math.min(1, ...rs.map(x => aw / (x.w + 2 * m)));
  frames.forEach((f, i) => {
    const cut = f.querySelector(".cut"), fr = f.querySelector("iframe"), x = rs[i];
    fr.style.width = w + "px"; fr.style.height = h + "px";
    if (whole) {
      cut.style.width = (w * s) + "px"; cut.style.height = (h * s) + "px";
      fr.style.transform = `scale(${s})`;
    } else {
      cut.style.width = ((x.w + 2 * m) * s) + "px"; cut.style.height = ((x.h + 2 * m) * s) + "px";
      fr.style.transform = `translate(${(-x.x + m) * s}px, ${(-x.y + m) * s}px) scale(${s})`;
    }
  });
}
function apply() {
  document.querySelectorAll("[data-scene]").forEach(b => b.setAttribute("aria-pressed", b.dataset.scene === S.scene));
  document.querySelectorAll("[data-size]").forEach(b => b.setAttribute("aria-pressed", b.dataset.size === S.size));
  document.querySelectorAll("[data-cut]").forEach(b => b.setAttribute("aria-pressed", b.dataset.cut === S.cut));
  document.getElementById("hint").innerHTML = HINT[S.scene];
  frames.forEach(f => {
    const fr = f.querySelector("iframe"), want = src(f.dataset.k);
    if (fr.getAttribute("src") !== want) { rect.delete(f.dataset.k); fr.setAttribute("src", want); }
    f.querySelector("figcaption a").href = src(f.dataset.k, true);
  });
  history.replaceState(null, "", `#scene=${S.scene}&size=${S.size}&cut=${S.cut}`);
  fit();
}
document.addEventListener("click", e => {
  const b = e.target.closest("button");
  if (!b) return;
  if (b.dataset.scene) S.scene = b.dataset.scene;
  if (b.dataset.size) { S.size = b.dataset.size; rect.clear(); frames.forEach(f => f.querySelector("iframe").removeAttribute("src")); }
  if (b.dataset.cut) S.cut = b.dataset.cut;
  apply();
});
addEventListener("resize", fit);
apply();
</script>
</body>
</html>
